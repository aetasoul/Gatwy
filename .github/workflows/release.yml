name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # Find the previous semver tag (strip optional v-prefix for correct sorting)
          CURRENT="${{ github.ref_name }}"
          CURRENT_BARE="${CURRENT#v}"
          PREV=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -t. -k1,1nr -k2,2nr -k3,3nr | while read -r t; do
            if [ "$t" != "$CURRENT_BARE" ]; then
              echo "$t"
              break
            fi
          done)
          if [ -z "$PREV" ]; then
            RANGE="${{ github.ref_name }}"
          else
            RANGE="${PREV}..${{ github.ref_name }}"
          fi

          # Collect merged PR numbers in range: merge-commit style ("Merge pull request #N ...")
          # and squash-merge style (subject ending in "(#N)")
          PR_NUMBERS=$(
            {
              git log $RANGE --merges --pretty=format:"%s" | grep -oE '^Merge pull request #[0-9]+' | grep -oE '[0-9]+'
              git log $RANGE --no-merges --pretty=format:"%s" | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+'
            } | sort -un
          )

          strip_prefix() { echo "$1" | sed -E 's/^(feat|feature|fix|perf)(\([^)]*\))?: ?//'; }
          capitalize() { python3 -c "import sys; s=sys.stdin.read().strip(); print(s[:1].upper()+s[1:] if s else '')" <<< "$1"; }

          FEATS=""
          FIXES=""
          MISC=""
          declare -A SEEN_PR
          AUTHORS=()

          for n in $PR_NUMBERS; do
            [ -n "${SEEN_PR[$n]:-}" ] && continue
            SEEN_PR[$n]=1

            ROW=$(gh pr view "$n" --json title,author,labels --jq '[.title, .author.login, (.labels|map(.name)|join(","))] | @tsv' 2>/dev/null) || continue
            [ -z "$ROW" ] && continue
            IFS=$'\t' read -r title author labels <<< "$ROW"
            [ -z "$title" ] && continue

            # Skip noise: dependency bumps, docs-only, chore/ci/test PRs
            case ",$labels," in
              *,dependencies,*|*,documentation,*) continue ;;
            esac
            if echo "$title" | grep -qiE '^(chore|docs|ci|test|build|release)(\([^)]*\))?:'; then
              continue
            fi

            if [ -n "$author" ] && [ "$author" != "$REPO_OWNER" ]; then
              already=0
              for a in "${AUTHORS[@]}"; do [ "$a" = "$author" ] && already=1; done
              [ "$already" -eq 0 ] && AUTHORS+=("$author")
            fi

            display=$(capitalize "$(strip_prefix "$title")")
            suffix=" (#${n}, @${author})"

            case ",$labels," in
              *,enhancement,*) FEATS="${FEATS}"$'\n'"- ${display}${suffix}" ;;
              *,bug,*) FIXES="${FIXES}"$'\n'"- ${display}${suffix}" ;;
              *)
                if echo "$title" | grep -qE '^(feat|feature)(\([^)]*\))?:'; then
                  FEATS="${FEATS}"$'\n'"- ${display}${suffix}"
                elif echo "$title" | grep -qE '^fix(\([^)]*\))?:'; then
                  FIXES="${FIXES}"$'\n'"- ${display}${suffix}"
                else
                  MISC="${MISC}"$'\n'"- ${display}${suffix}"
                fi
                ;;
            esac
          done

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          EOF_MARKER=$(openssl rand -hex 8)

          # Hand-written notes committed before tagging take precedence over auto-generation
          if [ -s RELEASE_NOTES.md ]; then
            echo "body<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
            cat RELEASE_NOTES.md >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "## 🐳 Container Image" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo '```bash' >> "$GITHUB_OUTPUT"
            echo "docker run -d -p 7443:7443 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo '```' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "body<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "## ✨ What's New in ${VERSION}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"

          if [ -n "$FEATS" ]; then
            echo "### 🚀 New Features" >> "$GITHUB_OUTPUT"
            echo "$FEATS" | sed '/^$/d' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> "$GITHUB_OUTPUT"
            echo "$FIXES" | sed '/^$/d' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$MISC" ]; then
            echo "### 🔧 Other Changes" >> "$GITHUB_OUTPUT"
            echo "$MISC" | sed '/^$/d' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$FEATS" ] && [ -z "$FIXES" ] && [ -z "$MISC" ]; then
            echo "- Minor improvements and bug fixes" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi

          if [ "${#AUTHORS[@]}" -gt 0 ]; then
            THANKS=$(printf '@%s, ' "${AUTHORS[@]}")
            THANKS="${THANKS%, }"
            echo "Thanks to ${THANKS} for their contributions!" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi

          echo "## 🐳 Container Image" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo '```bash' >> "$GITHUB_OUTPUT"
          echo "docker run -d -p 7443:7443 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo '```' >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ steps.notes.outputs.body }}
